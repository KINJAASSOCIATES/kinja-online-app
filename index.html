<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kinja Associates</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f6f8;--card:#fff;--tx:#1c2430;--mu:#6b7685;--br:#e1e5eb;--pr:#1d4e89;--ok:#1b8a5a;--bad:#c0392b;--wa:#b7791f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b212a;--tx:#e8ecf1;--mu:#93a0b0;--br:#2b3440;--pr:#5b9bd5;--ok:#3fbf8a;--bad:#e06c5f;--wa:#e0a84a}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1b212a;--tx:#e8ecf1;--mu:#93a0b0;--br:#2b3440;--pr:#5b9bd5;--ok:#3fbf8a;--bad:#e06c5f;--wa:#e0a84a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--pr);color:#fff;padding:14px 16px}header h1{margin:0;font-size:20px}header small{opacity:.85}
nav{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--br);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav button{border:0;background:none;color:var(--mu);padding:8px 14px;border-radius:20px;font-size:14px;white-space:nowrap;cursor:pointer}
nav button.on{background:var(--pr);color:#fff}
main{max-width:900px;margin:0 auto;padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--br);border-radius:12px;padding:14px;margin-bottom:12px}
.stat b{display:block;font-size:22px}.stat span{color:var(--mu);font-size:13px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--br);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.btn{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;font:inherit}
.sm{padding:4px 9px;font-size:12px;background:none;color:var(--pr);border:1px solid var(--br)}
.del{color:var(--bad)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--br)}
.row:first-child{border-top:0}.mu{color:var(--mu);font-size:13px}
.tag{font-size:12px;padding:2px 8px;border-radius:10px;border:1px solid var(--br)}
.in{color:var(--ok)}.out{color:var(--bad)}.over{color:var(--bad)}
h2{font-size:17px;margin:4px 0 10px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:720px}th,td{text-align:left;padding:8px 6px;border-top:1px solid var(--br);vertical-align:top}th{color:var(--mu);font-weight:600;border-top:0}tfoot td{font-weight:700;border-top:2px solid var(--br)}.p-High{color:var(--bad)}.p-Medium{color:var(--wa)}.p-Low{color:var(--mu)}
.empty{color:var(--mu);text-align:center;padding:16px}
@media (min-width:900px){header{position:sticky;top:0;z-index:6;padding:16px 32px}header h1{font-size:24px}
nav{position:fixed;left:0;top:72px;bottom:0;width:210px;flex-direction:column;gap:4px;padding:16px 12px;border-right:1px solid var(--br);border-bottom:0;overflow-y:auto}
nav button{text-align:left;border-radius:8px;font-size:15px;padding:11px 14px}
main{max-width:none;margin:0 0 0 210px;padding:24px 36px}
.grid{grid-template-columns:repeat(3,1fr)}table{min-width:0;font-size:14px}.card{padding:18px}}
.board{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}@media(max-width:800px){.board{grid-template-columns:1fr}}
.box{background:var(--card);border:1px solid var(--br);border-top:5px solid;border-radius:12px;padding:12px}.box.pend{border-top-color:var(--wa)}.box.dn{border-top-color:var(--ok)}.box .sc{max-height:68vh;overflow:auto}
.tk{border:1px solid var(--br);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--bg)}.tk.ov{border-color:var(--bad)}
#rc th,#rc td{color:#000}#rc table{border-collapse:collapse}#rc td,#rc th{border-top:1px solid #999;padding:6px}
header{display:flex;gap:12px;align-items:center;flex-wrap:wrap}#gs{position:relative;flex:1;min-width:240px;max-width:460px;margin-left:auto}#gs input{background:#fff;color:#1c2430}
#gsl{display:none;position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--card);color:var(--tx);border:1px solid var(--br);border-radius:10px;max-height:320px;overflow:auto;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.25)}.gsi{padding:9px 12px;cursor:pointer;border-top:1px solid var(--br)}.gsi:first-child{border-top:0}.gsi:hover{background:var(--bg)}
.rctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.rctl select,.rctl input{width:auto;min-width:150px}
.grid .stat{color:#fff;border:0;box-shadow:0 3px 10px rgba(0,0,0,.15)}.grid .stat b,.grid .stat span,.grid .stat div{color:#fff!important}
.grid .stat:nth-child(9n+1){background:linear-gradient(135deg,#667eea,#764ba2)}.grid .stat:nth-child(9n+2){background:linear-gradient(135deg,#f6819b,#f5576c)}.grid .stat:nth-child(9n+3){background:linear-gradient(135deg,#4facfe,#0083b0)}.grid .stat:nth-child(9n+4){background:linear-gradient(135deg,#f7971e,#e65c00)}.grid .stat:nth-child(9n+5){background:linear-gradient(135deg,#11998e,#2ecc71)}.grid .stat:nth-child(9n+6){background:linear-gradient(135deg,#8e2de2,#4a00e0)}.grid .stat:nth-child(9n+7){background:linear-gradient(135deg,#ee0979,#ff6a00)}.grid .stat:nth-child(9n+8){background:linear-gradient(135deg,#0f9b8e,#1e6fd9)}.grid .stat:nth-child(9n){background:linear-gradient(135deg,#c0392b,#e67e22)}
.board3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:start}@media(max-width:1000px){.board3{grid-template-columns:1fr}}
.box.pend{border-top-color:#f59e0b;background:linear-gradient(180deg,rgba(245,158,11,.18),var(--card) 90px)}.box.prog{border-top-color:#3b82f6;background:linear-gradient(180deg,rgba(59,130,246,.18),var(--card) 90px)}.box.dn{border-top-color:#22c55e;background:linear-gradient(180deg,rgba(34,197,94,.18),var(--card) 90px)}
.board>.card:nth-child(1){border-top:4px solid #ef4444;background:linear-gradient(180deg,rgba(239,68,68,.13),var(--card) 80px)}.board>.card:nth-child(2){border-top:4px solid #8b5cf6;background:linear-gradient(180deg,rgba(139,92,246,.13),var(--card) 80px)}
@media print{body *{visibility:hidden}#rc,#rc *{visibility:visible}#rc{position:absolute;left:0;top:0;width:100%;padding:20px}}
#rc{display:none}#rc.show{display:block}
table.n345 th:nth-child(n+3),table.n345 td:nth-child(n+3){text-align:right;white-space:nowrap}
table.n5678 th:nth-child(n+5),table.n5678 td:nth-child(n+5){text-align:right;white-space:nowrap}
table.n567 th:nth-child(n+5):not(:last-child),table.n567 td:nth-child(n+5):not(:last-child){text-align:right;white-space:nowrap}
table.rt th.r,table.rt td.r{text-align:right;white-space:nowrap}
</style></head><body>
<header><div><h1>Kinja Associates</h1><small>Chartered Accountants &amp; Tax Consultants</small> <small style="opacity:.7">· Version 6</small></div><div id="gs"><input id="gsq" placeholder="🔍 Party search (naam / PAN / GST / phone)" oninput="gsr(this.value)" autocomplete="off"><div id="gsl"></div></div></header>
<nav id="nav"></nav>
<main id="v"></main>
<div id="rc"></div>
<script>
var D={clients:[],tasks:[],txns:[],inv:[],set:{},banks:[],svcs:[]},tab='Dashboard',q='';

var VER=0,chain=Promise.resolve();
function save(){chain=chain.then(function(){return fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ver:VER,data:D})}).then(function(r){
 if(r.status==409){alert('Kisi aur computer ne data badla hai. Page refresh ho raha hai, apni entry dobara check karein.');return load()}
 return r.json().then(function(j){VER=j.ver})}).catch(function(){alert('Server se connection nahi hai! Data SAVE NAHI hua.')})})}
function load(){return fetch('/api/data',{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){VER=j.ver;D=(j.data&&j.data.clients)?j.data:{clients:[],tasks:[],txns:[]};D.inv=D.inv||[];D.set=D.set||{};D.banks=D.banks||[];D.svcs=D.svcs||[];if(!D.svcs.length&&!D.svcSeeded){D.svcSeeded=1;D.svcs=['GST Return Filing','ITR Filing','TDS Return Filing','Audit / Tax Audit','ROC / Company Compliance','Accounting / Bookkeeping','Consultancy'].map(n=>({id:uid(),name:n,sac:'',amt:0,gst:18}))}render()}).catch(function(){})}
setInterval(function(){var e=document.activeElement;if(e&&/INPUT|SELECT|TEXTAREA/.test(e.tagName))return;fetch('/api/ver',{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){if(j.ver!=VER)load()}).catch(function(){})},8000);
function $(x){return document.getElementById(x)}
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function inr(n){return '₹'+Number(n||0).toLocaleString('en-IN')}
function today(){return new Date().toISOString().slice(0,10)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function cname(id){var c=D.clients.find(function(x){return x.id==id});return c?c.name:'—'}
function copts(){return D.clients.map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+'</option>'}).join('')}
var tabs=['Dashboard','Clients','Tasks','Invoices','Ledger','Receipts','Payments','Cash-Bank','Reports','Automation','Settings'];
function nav(){$('nav').innerHTML=tabs.map(function(t){return '<button class="'+(t==tab?'on':'')+'" onclick="go(\''+t+'\')">'+t.replace('-',' &amp; ')+'</button>'}).join('')}
function go(t){tab=t;q='';nav();render()}
function render(){
 var h='';
 if(tab=='Dashboard'){
  var rec=0,pay=0;D.txns.forEach(function(t){t.type=='Receipt'?rec+=+t.amt:pay+=+t.amt});
  var pend=D.tasks.filter(function(t){return t.st!='Done'});
  var od=pend.filter(function(t){return t.due&&t.due<today()});
  h+='<div class="grid"><div class="card stat"><b>'+D.clients.length+'</b><span>Clients</span></div><div class="card stat"><b>'+pend.length+'</b><span>Pending tasks</span></div><div class="card stat"><b class="over">'+od.length+'</b><span>Overdue</span></div><div class="card stat"><b class="in">'+inr(rec)+'</b><span>Received</span></div><div class="card stat"><b class="out">'+inr(pay)+'</b><span>Paid out</span></div><div class="card stat"><b>'+inr(rec-pay)+'</b><span>Net balance</span></div><div class="card stat"><b>'+inr(tb())+'</b><span>Total billed (with GST)</span></div><div class="card stat"><b class="over">'+inr(tb()-rec)+'</b><span>Due balance</span></div><div class="card stat"><b>'+inr(tg())+'</b><span>GST on fees</span></div></div>';
  h+='<div class="card"><h2>Upcoming tasks</h2>'+(pend.length?pend.sort(function(a,b){return (a.due||'9').localeCompare(b.due||'9')}).slice(0,6).map(function(t){return '<div class="row"><div>'+esc(t.title)+'<div class="mu">'+esc(cname(t.cid))+'</div></div><span class="'+(t.due&&t.due<today()?'over':'mu')+'">'+(t.due||'')+'</span></div>'}).join(''):'<div class="empty">Koi pending task nahi</div>')+'</div>';
 }
 if(tab=='Clients'){
  h+='<div class="card"><h2>Naya client</h2><form onsubmit="return addC(event)"><input name="name" placeholder="Client name" required><input name="pan" placeholder="PAN" maxlength="10"><input name="gstin" placeholder="GST Number (15 digit)" maxlength="15" style="text-transform:uppercase" oninput="gstAuto(this)"><button type="button" class="btn" onclick="gstFill(this.form)">🔍 GST se details bharo</button><button type="button" class="btn" onclick="gstPaste(this.form)">📋 Portal ka result paste karo</button><input name="addr" placeholder="Address"><input type="hidden" name="gs"><input name="ph" placeholder="Phone"><input name="em" placeholder="Email"><select name="svc"><option>ITR Filing</option><option>GST</option><option>Audit</option><option>TDS</option><option>ROC / Company</option><option>Other</option></select><input name="fee" type="number" placeholder="Fee (₹)"><select name="gst"><option value="18">GST 18%</option><option value="12">GST 12%</option><option value="5">GST 5%</option><option value="0">No GST</option></select><button class="btn">Add</button></form></div>';
  h+='<div class="card"><input placeholder="Search client..." value="'+esc(q)+'" oninput="q=this.value;list()"><div id="L"></div></div>';
 }
 if(tab=='Tasks'){
  h+='<div class="card"><h2>Naya task</h2>'+(D.clients.length?'<form onsubmit="return addT(event)"><input name="title" placeholder="Task (e.g. GSTR-3B)" required><select name="cat"><option>GST</option><option>Income Tax</option><option>TDS</option><option>Audit</option><option>ROC</option><option>Other</option></select><select name="pri"><option>High</option><option selected>Medium</option><option>Low</option></select><select name="cid">'+copts()+'</select><input name="by" list="stf" placeholder="Kisko assign (naam)">'+stfDL()+'<input name="due" type="date"><input name="rem" placeholder="Remarks"><button class="btn">Add</button></form>':'<div class="empty">Pehle client add karein</div>')+'</div><div class="card" id="L"></div>';
 }
 if(tab=='Receipts'||tab=='Payments'){
  var ty=tab=='Receipts'?'Receipt':'Payment';
  h+='<div class="card"><h2>Nayi '+ty+' entry</h2><form onsubmit="return addX(event,\''+ty+'\')"><select name="cid">'+copts()+'</select><input name="amt" type="number" placeholder="Amount (₹)" required><input name="date" type="date" value="'+today()+'"><select name="mode"><option>Cash</option><option>UPI</option><option>Bank Transfer</option><option>Cheque</option></select><select name="acc" title="Bank account">'+bopts()+'</select><input name="note" placeholder="Note / purpose"><button class="btn">Save</button></form></div><div class="card" id="L"></div>';
 }
 $('v').innerHTML=h;list();
}
function list(){
 var L=$('L');if(!L)return;var h='';
 if(tab=='Clients'){L.innerHTML=ctable();return}
 if(tab=='Tasks'){L.innerHTML=ttable();return}
 if(tab=='Clients'){
  var a=D.clients.filter(function(c){return (c.name+c.pan).toLowerCase().indexOf(q.toLowerCase())>-1});
  h=a.length?a.map(function(c){return '<div class="row"><div><b>'+esc(c.name)+'</b> <span class="tag">'+esc(c.svc)+'</span><div class="mu">PAN: '+esc(c.pan||'—').toUpperCase()+' · '+esc(c.ph)+' '+esc(c.em)+'</div><div class="mu">Fee: '+inr(c.fee)+' · Received: '+inr(bal(c.id))+'</div></div><button class="btn sm del" onclick="delC(\''+c.id+'\')">Delete</button></div>'}).join(''):'<div class="empty">Koi client nahi</div>';
 }
 if(tab=='Tasks'){
  h=D.tasks.length?D.tasks.map(function(t){return '<div class="row"><div><b'+(t.st=='Done'?' style="text-decoration:line-through"':'')+'>'+esc(t.title)+'</b><div class="mu">'+esc(cname(t.cid))+' · <span class="'+(t.st!='Done'&&t.due&&t.due<today()?'over':'')+'">Due '+(t.due||'—')+'</span></div></div><div><button class="btn sm" onclick="cyc(\''+t.id+'\')">'+t.st+'</button> <button class="btn sm del" onclick="delT(\''+t.id+'\')">✕</button></div></div>'}).join(''):'<div class="empty">Koi task nahi</div>';
 }
 if(tab=='Receipts'||tab=='Payments'){
  var ty=tab=='Receipts'?'Receipt':'Payment';
  var a=D.txns.filter(function(t){return t.type==ty}).sort(function(a,b){return b.date.localeCompare(a.date)});
  h=a.length?a.map(function(t){return '<div class="row"><div><b class="'+(ty=='Receipt'?'in':'out')+'">'+inr(t.amt)+'</b> · '+esc(cname(t.cid))+'<div class="mu">'+t.date+' · '+esc(t.mode)+(t.mode!='Cash'&&t.acc?' ('+esc(bn(t.acc))+')':'')+' · '+esc(t.note)+' · #'+t.no+'</div></div><div><button class="btn sm" onclick="editX(\''+t.id+'\')">Edit</button> '+(ty=='Receipt'?'<button class="btn sm" onclick="prn(\''+t.id+'\')">Print</button> ':'')+'<button class="btn sm del" onclick="delX(\''+t.id+'\')">✕</button></div></div>'}).join(''):'<div class="empty">Koi entry nahi</div>';
 }
 L.innerHTML=h;
}
function gA(c){return Math.round((+c.fee||0)*(+(c.gst==null?18:c.gst))/100)}
function tb(){return D.clients.reduce(function(s,c){return s+(+c.fee||0)+gA(c)},0)}
function tg(){return D.clients.reduce(function(s,c){return s+gA(c)},0)}
function pc(id){return D.tasks.filter(function(t){return t.cid==id&&t.st!='Done'}).length}
function ctable(){
 var a=D.clients.filter(function(c){return (c.name+(c.pan||'')+(c.gstin||'')).toLowerCase().indexOf(q.toLowerCase())>-1});
 if(!a.length)return '<div class="empty">Koi client nahi</div>';
 var F=0,G=0,B=0,R=0,P=0;
 var r=a.map(function(c){var f=+c.fee||0,g=gA(c),b=f+g,rc=bal(c.id),d=b-rc,p=pc(c.id);F+=f;G+=g;B+=b;R+=rc;P+=p;
 return '<tr><td><b>'+esc(c.name)+'</b><div class="mu">'+esc((c.pan||'').toUpperCase())+' '+esc(c.ph)+'</div></td><td>'+esc(c.svc)+'</td><td>'+inr(f)+'</td><td>'+inr(g)+' <span class="mu">('+(c.gst==null?18:c.gst)+'%)</span></td><td>'+inr(b)+'</td><td class="in">'+inr(rc)+'</td><td class="'+(d>0?'over':'in')+'"><b>'+inr(d)+'</b></td><td>'+p+'</td><td><button class="btn sm del" onclick="delC(\''+c.id+'\')">✕</button></td></tr>'}).join('');
 return '<div style="overflow-x:auto"><table class="n5678"><thead><tr><th>Client</th><th>Service</th><th>Fee</th><th>Tax Component</th><th>Total</th><th>Received</th><th>Due Balance</th><th>Pending Tasks</th><th></th></tr></thead><tbody>'+r+'</tbody><tfoot><tr><td>Total</td><td></td><td>'+inr(F)+'</td><td>'+inr(G)+'</td><td>'+inr(B)+'</td><td>'+inr(R)+'</td><td>'+inr(B-R)+'</td><td>'+P+'</td><td></td></tr></tfoot></table></div>'}
function ttable(){
 if(!D.tasks.length)return '<div class="empty">Koi task nahi</div>';
 var o={'Pending':0,'In Progress':1,'Done':2};
 var a=D.tasks.slice().sort(function(x,y){return o[x.st]-o[y.st]||(x.due||'9').localeCompare(y.due||'9')});
 var n=D.tasks.filter(function(t){return t.st!='Done'}).length;
 var r=a.map(function(t){var ov=t.st!='Done'&&t.due&&t.due<today();
 return '<tr><td'+(t.st=='Done'?' style="text-decoration:line-through"':'')+'><b>'+esc(t.title)+'</b></td><td>'+esc(cname(t.cid))+'</td><td>'+esc(t.cat||'—')+'</td><td class="p-'+esc(t.pri||'Medium')+'">'+esc(t.pri||'Medium')+'</td><td class="'+(ov?'over':'')+'">'+(t.due||'—')+(ov?' (overdue)':'')+'</td><td class="mu">'+esc(t.rem||'')+'</td><td><button class="btn sm" onclick="cyc(\''+t.id+'\')">'+t.st+'</button></td><td><button class="btn sm del" onclick="delT(\''+t.id+'\')">✕</button></td></tr>'}).join('');
 return '<h2>Pending tasks: '+n+' / '+D.tasks.length+'</h2><div style="overflow-x:auto"><table><thead><tr><th>Task</th><th>Client</th><th>Tax Type</th><th>Priority</th><th>Due</th><th>Remarks</th><th>Status</th><th></th></tr></thead><tbody>'+r+'</tbody></table></div>'}
function bal(id){return D.txns.filter(function(t){return t.cid==id&&t.type=='Receipt'}).reduce(function(s,t){return s+ +t.amt},0)}
function fd(e){e.preventDefault();var o={};new FormData(e.target).forEach(function(v,k){o[k]=v});return o}
function addC(e){var o=fd(e);o.id=uid();D.clients.push(o);save();render();return false}
function addT(e){var o=fd(e);o.id=uid();o.st='Pending';D.tasks.push(o);save();render();return false}
function addX(e,ty){var o=fd(e);if(!o.cid){alert('Pehle client add karein');return false}o.id=uid();o.type=ty;o.no=(ty=='Receipt'?'R':'P')+String(D.txns.filter(function(t){return t.type==ty}).length+1).padStart(3,'0');D.txns.push(o);save();render();return false}
function cyc(id){var t=D.tasks.find(function(x){return x.id==id}),o=['Pending','In Progress','Done'];t.st=o[(o.indexOf(t.st)+1)%3];save();list()}
function delC(id){if(confirm('Client delete karein?')){D.clients=D.clients.filter(function(x){return x.id!=id});save();render()}}
function delT(id){D.tasks=D.tasks.filter(function(x){return x.id!=id});save();list()}
function delX(id){if(confirm('Entry delete karein?')){D.txns=D.txns.filter(function(x){return x.id!=id});save();list()}}
function prn(id){var t=D.txns.find(function(x){return x.id==id}),r=$('rc');

function gstParse(t){var L=t.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 function pv(re){for(var i=0;i<L.length;i++){if(re.test(L[i])){var p=L[i].split(/\t|\s*:\s+|\s{2,}/).map(x=>x.trim()).filter(Boolean);if(p.length>1)return p.slice(1).join(' ');return (L[i+1]||'').trim()}}return ''}
 var ad='';for(var i=0;i<L.length&&!ad;i++){if(/^principal place of business/i.test(L[i])){var p=L[i].split(/\t|\s*:\s+/);if(p.length>1&&p[1].trim()){ad=p.slice(1).join(' ').trim();break}
  for(var j=i+1;j<Math.min(L.length,i+6);j++){if(/^(address:?|principal place.*|nature of.*|date of.*|constitution.*|state.*)$/i.test(L[j]))continue;ad=L[j];break}}}
 return {gstin:(t.match(/\b\d{2}[A-Z]{5}\d{4}[A-Z][1-9A-Z]Z[0-9A-Z]\b/)||[''])[0],name:pv(/^legal name/i)||pv(/^trade name/i),addr:ad,status:pv(/gstin\s*\/\s*uin\s*status/i)||pv(/^status\b/i)}}

 document.body.appendChild(m);var $m=x=>m.querySelector(x);
 $m('#gpc').onclick=()=>m.remove();
 $m('#gpo').onclick=()=>{var g=f.gstin.value.trim().toUpperCase();try{navigator.clipboard.writeText(g)}catch(e){}window.open('https://services.gst.gov.in/services/searchtp','_blank')};
 $m('#gpb').onclick=()=>{var r=gstParse($m('#gpt').value);if(!r.name&&!r.addr&&!r.status){alert('Samajh nahi aaya. Result page par Ctrl+A, Ctrl+C karke poora text paste karein.');return}
  if(r.gstin&&!f.gstin.value)f.gstin.value=r.gstin;var g=f.gstin.value.toUpperCase();if(g.length==15&&!f.pan.value)f.pan.value=g.slice(2,12);

  alert('Bhar diya:\nNaam: '+(r.name||'\u2014')+'\nStatus: '+(r.status||'\u2014')+'\nAddress: '+(r.addr||'\u2014')+'\n\nCheck karke Add dabayein.')}}

 D.svcs.map(x=>'<div class="row"><div><b>'+esc(x.name)+'</b><div class="mu">'+(x.sac?'SAC '+esc(x.sac)+' \u00b7 ':'')+inr(x.amt)+' \u00b7 GST '+x.gst+'%</div></div><button class="btn sm del" onclick="delSv(\''+x.id+'\')">\u2715</button></div>').join('')+'</div>'}

/* ===== Edit Receipt / Payment entry ===== */
function editX(id){
 var t=D.txns.find(function(x){return x.id==id});if(!t)return;
 var old=document.getElementById('editBox');if(old)old.remove();
 var m=['Cash','UPI','Bank Transfer','Cheque'].map(function(x){return '<option'+(x==t.mode?' selected':'')+'>'+x+'</option>'}).join('');
 var co=copts().replace('value="'+t.cid+'"','value="'+t.cid+'" selected');
 var bo=bopts();if(t.acc)bo=bo.replace('value="'+t.acc+'"','value="'+t.acc+'" selected');
 var d=document.createElement('div');d.id='editBox';
 d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:14px';

 document.body.appendChild(d);
 d.addEventListener('click',function(e){if(e.target===d)d.remove()});

/* ===== Task complete -> Invoice (prefilled form) ===== */

function taskInv(id){
 var t=D.tasks.find(function(x){return x.id==id});if(!t)return;
 var c=D.clients.find(function(x){return x.id==t.cid});
 if(!c){alert('Is task ka client nahi mila');return}
 var old=document.getElementById('tinvBox');if(old)old.remove();
 var g=String(c.gst==null?18:c.gst);
 var go=[['18','GST 18%'],['12','GST 12%'],['5','GST 5%'],['0','No GST']].map(function(x){return '<option value="'+x[0]+'"'+(x[0]==g?' selected':'')+'>'+x[1]+'</option>'}).join('');
 var d=document.createElement('div');d.id='tinvBox';
 d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:14px';
 d.innerHTML='<div class="card" style="width:100%;max-width:460px;max-height:92vh;overflow:auto;margin:0"><h2>\u2705 Task complete \u2013 Invoice banayein?</h2><div class="mu" style="margin-bottom:8px">'+esc(t.title)+' \u00b7 <b>'+esc(c.name)+'</b></div><form id="tinvF" style="display:grid;gap:8px"><select name="svcid" onchange="svcPick(this)"><option value="">\u2014 Service chunein / custom \u2014</option>'+sopts()+'</select><input name="desc" placeholder="Service / description" required value="'+esc(t.title)+'"><input name="amt" type="number" step="0.01" placeholder="Amount (GST se pehle)" required value="'+(+c.fee>0?esc(c.fee):'')+'"><select name="gst">'+go+'</select><select name="tt"><option value="">Auto (state se)</option><option value="C">CGST + SGST</option><option value="I">IGST</option></select><input name="date" type="date" value="'+today()+'"><input name="due" type="date" title="Due date"><select name="bk" title="Bank account (invoice par)">'+bopts()+'</select><div style="display:flex;gap:8px"><button class="btn" type="submit">Invoice banayein</button><button class="btn del" type="button" onclick="document.getElementById(\'tinvBox\').remove()">Abhi nahi</button></div></form></div>';
 document.body.appendChild(d);
 document.getElementById('tinvF').onsubmit=function(e){var o=fd(e);
  var i=mkInv(c.id,o.desc,+o.amt,+o.gst,o.date,o.due,o.tt),sv=D.svcs.find(function(x){return x.id==o.svcid});
  i.sac=sv?sv.sac:'';i.bk=o.bk;i.tid=t.id;t.inv=i.id;
  save();d.remove();render();
  if(confirm('Invoice '+i.no+' ban gaya. Abhi print karein?'))prI(i.id);return false}
}

/* ===== Edit Invoice ===== */
function editI(id){
 var i=D.inv.find(function(x){return x.id==id});if(!i)return;
 var old=document.getElementById('einvBox');if(old)old.remove();
 var co=copts().replace('value="'+i.cid+'"','value="'+i.cid+'" selected');
 var g=String(i.gst);
 var go=[['18','GST 18%'],['12','GST 12%'],['5','GST 5%'],['0','No GST']];if(!go.some(function(x){return x[0]==g}))go.push([g,'GST '+g+'%']);
 go=go.map(function(x){return '<option value="'+x[0]+'"'+(x[0]==g?' selected':'')+'>'+x[1]+'</option>'}).join('');
 var tt=i.tt||autoTT(i.cid);
 var to='<option value="C"'+(tt=='C'?' selected':'')+'>CGST + SGST</option><option value="I"'+(tt=='I'?' selected':'')+'>IGST</option>';
 var bo=bopts();if(i.bk)bo=bo.replace('value="'+i.bk+'"','value="'+i.bk+'" selected');
 var d=document.createElement('div');d.id='einvBox';
 d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:14px';
 d.innerHTML='<div class="card" style="width:100%;max-width:460px;max-height:92vh;overflow:auto;margin:0"><h2>Edit Invoice '+esc(i.no)+'</h2><form id="einvF" style="display:grid;gap:8px"><select name="cid">'+co+'</select><select name="svcid" onchange="svcPick(this)"><option value="">\u2014 Service chunein / custom \u2014</option>'+sopts()+'</select><input name="desc" placeholder="Service / description" required value="'+esc(i.desc)+'"><input name="sac" placeholder="SAC code (optional)" value="'+esc(i.sac||'')+'"><input name="amt" type="number" step="0.01" placeholder="Amount (GST se pehle)" required value="'+esc(i.amt)+'"><select name="gst">'+go+'</select><select name="tt">'+to+'</select><input name="date" type="date" required value="'+esc(i.date)+'"><input name="due" type="date" title="Due date" value="'+esc(i.due||'')+'"><select name="bk" title="Bank account (invoice par)">'+bo+'</select><label class="mu" style="margin-bottom:-4px">Terms &amp; Conditions (har line = ek point)</label><textarea name="terms" rows="5">'+esc(i.terms||curTerms())+'</textarea><div style="display:flex;gap:8px"><button class="btn" type="submit">Update</button><button class="btn del" type="button" onclick="document.getElementById(\'einvBox\').remove()">Cancel</button></div></form></div>';
 document.body.appendChild(d);
 document.getElementById('einvF').onsubmit=function(e){var o=fd(e),sv=D.svcs.find(function(x){return x.id==o.svcid});
  i.cid=o.cid;i.desc=o.desc;i.amt=+o.amt;i.gst=+o.gst;i.tax=Math.round(i.amt*i.gst/100);i.total=i.amt+i.tax;
  i.tt=o.tt;i.date=o.date;i.due=o.due;i.bk=o.bk;i.terms=(o.terms||'').trim()==curTerms().trim()?'':(o.terms||'').trim();i.sac=sv&&sv.sac?sv.sac:o.sac;
  save();d.remove();render();
  if(confirm('Invoice '+i.no+' update ho gaya. Abhi print karein?'))prI(i.id);return false}
}

/* ===== Edit Client ===== */
function editC(id){
 var c=D.clients.find(function(x){return x.id==id});if(!c)return;
 var old=document.getElementById('ecBox');if(old)old.remove();
 var sv=['ITR Filing','GST','Audit','TDS','ROC / Company','Other'];if(c.svc&&sv.indexOf(c.svc)<0)sv.push(c.svc);
 var so=sv.map(function(x){return '<option'+(x==c.svc?' selected':'')+'>'+esc(x)+'</option>'}).join('');
 var g=String(c.gst==null?18:c.gst);
 var go=[['18','GST 18%'],['12','GST 12%'],['5','GST 5%'],['0','No GST']].map(function(x){return '<option value="'+x[0]+'"'+(x[0]==g?' selected':'')+'>'+x[1]+'</option>'}).join('');
 var L=function(t){return '<label class="mu" style="margin-bottom:-4px">'+t+'</label>'};
 var d=document.createElement('div');d.id='ecBox';
 d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:14px';
 d.innerHTML='<div class="card" style="width:100%;max-width:480px;max-height:92vh;overflow:auto;margin:0"><h2>Edit Client</h2><form id="ecF" style="display:grid;gap:8px;grid-template-columns:1fr">'+L('Client name')+'<input name="name" required value="'+esc(c.name)+'">'+L('PAN')+'<input name="pan" maxlength="10" style="text-transform:uppercase" value="'+esc(c.pan||'')+'">'+L('GST Number')+'<input name="gstin" maxlength="15" style="text-transform:uppercase" value="'+esc(c.gstin||'')+'">'+L('Address')+'<input name="addr" value="'+esc(c.addr||'')+'">'+L('Phone')+'<input name="ph" value="'+esc(c.ph||'')+'">'+L('Email')+'<input name="em" value="'+esc(c.em||'')+'">'+L('Service')+'<select name="svc">'+so+'</select>'+L('Fee (\u20b9)')+'<input name="fee" type="number" step="any" value="'+esc(c.fee==null?'':c.fee)+'">'+L('GST on fee')+'<select name="gst">'+go+'</select>'+L('Opening balance (\u20b9)')+'<input name="ob" type="number" step="any" value="'+esc(c.ob||0)+'"><div style="display:flex;gap:8px"><button class="btn" type="submit">Update</button><button class="btn del" type="button" onclick="document.getElementById(\'ecBox\').remove()">Cancel</button></div></form></div>';
 document.body.appendChild(d);
 document.getElementById('ecF').onsubmit=function(e){var o=fd(e);
  o.gstin=(o.gstin||'').trim().toUpperCase();
  if(o.gstin&&!gOk(o.gstin)&&!confirm('GSTIN galat lag raha hai (format/checksum). Phir bhi save karein?'))return false;
  if(o.gstin&&o.gstin.length==15&&!o.pan)o.pan=o.gstin.slice(2,12);
  o.pan=(o.pan||'').toUpperCase();
  if(o.gstin!==(c.gstin||''))c.gs='';
  ['name','pan','gstin','addr','ph','em','svc','fee','gst'].forEach(function(k){c[k]=o[k]});
  c.ob=+o.ob||0;
  save();d.remove();render();return false}
}

/* ===== Invoice settings: Logo + Terms & Conditions ===== */
var DEF_TERMS=['Payment is due on or before the due date mentioned on this invoice.','Cheque / DD to be drawn in favour of "Kinja Associates", or pay online to the bank account shown above.','Fees once paid are non-refundable. GST is charged as applicable.','All disputes are subject to local jurisdiction only.'].join('\n');
function curTerms(){var t=(D.set||{}).terms;return t==null?DEF_TERMS:t}
function termsBlock(i){var L=(i.terms||curTerms()).split('\n').map(function(x){return x.trim()}).filter(Boolean);if(!L.length)return '';
 return '<div style="font-size:12px;margin-top:8px"><b>Terms &amp; Conditions</b><ol style="margin:4px 0 0 18px;padding:0">'+L.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ol></div>'}
function logoImg(){var s=D.set||{};return s.logo?'<img src="'+s.logo+'" alt="" style="max-height:'+(+s.logoH||70)+'px;max-width:100%;margin-bottom:4px"><br>':''}
function setLogo(inp){var f=inp.files&&inp.files[0];if(!f)return;if(!/^image\//.test(f.type)){alert('Image file chunein (PNG/JPG)');return}
 var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var k=Math.min(1,400/im.width,200/im.height),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  D.set=D.set||{};D.set.logo=c.toDataURL('image/png');save();render()};im.onerror=function(){alert('Image padh nahi paye')};im.src=r.result};r.readAsDataURL(f)}
function rmLogo(){if(confirm('Logo hatayein?')){D.set=D.set||{};D.set.logo='';save();render()}}
function saveLogoH(){D.set=D.set||{};D.set.logoH=Math.min(200,Math.max(20,+document.getElementById('logoH').value||70));save();render()}
function saveTerms(){D.set=D.set||{};D.set.terms=document.getElementById('termsTx').value.trim();save();render();alert('Terms save ho gaye')}
function resetTerms(){if(confirm('Terms default par wapas karein?')){D.set=D.set||{};delete D.set.terms;save();render()}}
function invSetCard(){var s=D.set||{};
 return '<div class="card"><h2>\ud83e\uddfe Invoice Settings</h2>'+
 '<div style="margin-bottom:14px"><b>Logo</b> <span class="mu">(invoice ke upar dikhega)</span><div style="margin:8px 0">'+(s.logo?'<img src="'+s.logo+'" alt="logo" style="max-height:'+(+s.logoH||70)+'px;max-width:100%;background:#fff;padding:4px;border:1px solid var(--br);border-radius:8px">':'<span class="mu">Abhi logo nahi hai</span>')+'</div>'+
 '<div class="rctl"><input type="file" accept="image/*" onchange="setLogo(this)" style="max-width:260px">'+(s.logo?'<button class="btn sm del" onclick="rmLogo()">Logo hatayein</button>':'')+'<span class="mu">Logo height (px):</span><input id="logoH" type="number" min="20" max="200" value="'+(+s.logoH||70)+'" style="width:90px"><button class="btn sm" onclick="saveLogoH()">Set</button></div></div>'+
 '<div><b>Terms &amp; Conditions</b> <span class="mu">(har line ek point, invoice par 1, 2, 3, 4... number ke saath aayega)</span><textarea id="termsTx" rows="6" style="margin:8px 0">'+esc(curTerms())+'</textarea><div class="rctl"><button class="btn" onclick="saveTerms()">Save Terms</button><button class="btn sm" onclick="resetTerms()">Default par wapas</button></div><div class="mu" style="margin-top:6px">Kisi ek invoice ke liye alag terms chahiye to Invoices me us invoice ka Edit dabaiye.</div></div></div>'}
var _vSet=vSet;vSet=function(){return invSetCard()+_vSet()};
